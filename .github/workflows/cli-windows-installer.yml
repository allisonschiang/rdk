name: Build CLI Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_type:
        default: pr
        required: true
        type: choice
        options: [pr, latest, stable]
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
    secrets:
      GCP_CREDENTIALS:
        required: true

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      # Prefer the windows binary built by the cli job in the same workflow run
      # (the common case when this workflow is invoked from stable.yml or main.yml).
      # If no artifact exists (e.g. standalone workflow_dispatch), fall back to
      # compiling viam.exe from source.
      - name: Download viam binary from cli build
        id: download_binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: viam-cli-windows-amd64
          path: bin/windows-amd64

      - uses: actions/setup-go@v5
        if: steps.download_binary.outcome != 'success'
        with:
          go-version-file: go.mod

      - name: Build viam.exe (fallback when no artifact)
        if: steps.download_binary.outcome != 'success'
        shell: bash
        run: GOOS=windows GOARCH=amd64 make cli

      - name: Stage viam.exe for MSI build
        shell: bash
        run: cp bin/windows-amd64/viam-cli cli/windows-installer/viam.exe

      - name: Sign viam.exe
        if: github.repository == 'viamrobotics/rdk'
        uses: ./.github/actions/sign-windows
        with:
          files: 'cli/windows-installer/viam.exe'

      - name: Build MSI
        shell: bash
        run: |
          cd cli/windows-installer
          dotnet tool restore
          dotnet build -c Release
          mkdir -p releases
          mv bin/x64/Release/en-US/Package.msi releases/viam-cli-windows-installer.msi

      - name: Sign MSI
        if: github.repository == 'viamrobotics/rdk'
        uses: ./.github/actions/sign-windows
        with:
          files: 'cli/windows-installer/releases/viam-cli-windows-installer.msi'

      - uses: actions/upload-artifact@v4
        with:
          name: viam-cli-windows-installer
          path: cli/windows-installer/releases/viam-cli-windows-installer.msi

      - name: Authorize GCP Upload
        if: inputs.release_type != 'pr'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Upload installer to GCS
        if: inputs.release_type != 'pr'
        uses: google-github-actions/upload-cloud-storage@v0.10.4
        with:
          headers: "cache-control: no-cache"
          path: cli/windows-installer/releases/viam-cli-windows-installer.msi
          destination: packages.viam.com/apps/viam-cli/
          parent: false
